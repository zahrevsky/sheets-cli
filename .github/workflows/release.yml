name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export VERSION="${RELEASE_TAG#v}"
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('npm/cli/package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('npm/cli/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Sync npm package versions
        run: bun scripts/sync-npm-versions.ts

      - name: Build native binaries (all platforms)
        run: bun scripts/build-release-binaries.ts

      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: npm/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: npm

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish npm packages
        working-directory: npm
        run: |
          set -euo pipefail
          find platforms -type f \( -path '*/bin/sheets-cli' -o -path '*/bin/sheets-cli.exe' \) -exec chmod +x {} +
          publish_if_missing() {
            local dir="${1%/}/"
            local name version
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skip ${name}@${version} (already on npm)"
              return 0
            fi
            echo "Publishing ${name}@${version} from ${dir}..."
            npm publish "${dir}" --access public
          }
          for dir in platforms/*/; do
            publish_if_missing "${dir}"
          done
          publish_if_missing "cli"
