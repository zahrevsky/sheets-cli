name: Upstream watch

# Triggers a Cursor automation webhook on schedule (prompt is configured in Cursor).
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-watch
  cancel-in-progress: false

env:
  # Edit this line to point at the upstream repository (owner/name).
  UPSTREAM_REPO: gmickel/sheets-cli

jobs:
  trigger-cursor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cursor webhook
        env:
          CURSOR_UPSTREAM_WEBHOOK_URL: ${{ secrets.CURSOR_UPSTREAM_WEBHOOK_URL }}
          CURSOR_UPSTREAM_WEBHOOK_BEARER: ${{ secrets.CURSOR_UPSTREAM_WEBHOOK_BEARER }}
        run: |
          if [ -z "$CURSOR_UPSTREAM_WEBHOOK_URL" ]; then
            echo "::warning::CURSOR_UPSTREAM_WEBHOOK_URL is not set; skipping."
            exit 0
          fi
          HTTP_CODE=$(curl --silent --show-error --output /tmp/cursor-webhook-response.txt --write-out "%{http_code}" \
            --request POST \
            --url "$CURSOR_UPSTREAM_WEBHOOK_URL" \
            --header "Authorization: Bearer ${CURSOR_UPSTREAM_WEBHOOK_BEARER}")
          echo "Upstream repo (reference): ${{ env.UPSTREAM_REPO }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Webhook HTTP ${HTTP_CODE}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Webhook returned HTTP ${HTTP_CODE}"
            [ -f /tmp/cursor-webhook-response.txt ] && cat /tmp/cursor-webhook-response.txt
            exit 0
          fi
