name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

env:
  SHEETS_CLI_INTEGRATION: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bun run typecheck
      - run: bun x ultracite check

  npm-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun scripts/build-release-binaries.ts

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Require Google API credentials
        env:
          SHEETS_CLI_CREDENTIALS_JSON: ${{ secrets.SHEETS_CLI_CREDENTIALS_JSON }}
          SHEETS_CLI_TOKEN_JSON: ${{ secrets.SHEETS_CLI_TOKEN_JSON }}
        run: |
          if [ -z "$SHEETS_CLI_CREDENTIALS_JSON" ] || [ -z "$SHEETS_CLI_TOKEN_JSON" ]; then
            echo "::error::Missing SHEETS_CLI_CREDENTIALS_JSON or SHEETS_CLI_TOKEN_JSON."
            echo "::error::For workflows triggered by dependabot[bot], duplicate these values as Dependabot secrets (Settings → Secrets and variables → Dependabot) with the same names."
            exit 1
          fi
      - name: Integration tests (live Google API)
        env:
          SHEETS_CLI_INTEGRATION: "1"
          SHEETS_CLI_CREDENTIALS_JSON: ${{ secrets.SHEETS_CLI_CREDENTIALS_JSON }}
          SHEETS_CLI_TOKEN_JSON: ${{ secrets.SHEETS_CLI_TOKEN_JSON }}
        run: |
          mkdir -p "$HOME/.sheets-cli"
          echo "$SHEETS_CLI_CREDENTIALS_JSON" > "$HOME/.sheets-cli/credentials.json"
          echo "$SHEETS_CLI_TOKEN_JSON" > "$HOME/.sheets-cli/token.json"
          bun test src/__tests__/integration
