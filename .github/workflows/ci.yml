name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bun run typecheck
      - run: bun x ultracite check

  npm-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun scripts/build-release-binaries.ts

  integration:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Integration tests (live Google API)
        if: ${{ secrets.SHEETS_CLI_INTEGRATION == '1' }}
        env:
          SHEETS_CLI_INTEGRATION: "1"
          SHEETS_CLI_CREDENTIALS_JSON: ${{ secrets.SHEETS_CLI_CREDENTIALS_JSON }}
          SHEETS_CLI_TOKEN_JSON: ${{ secrets.SHEETS_CLI_TOKEN_JSON }}
        run: |
          if [ -n "$SHEETS_CLI_CREDENTIALS_JSON" ]; then
            mkdir -p "$HOME/.sheets-cli"
            echo "$SHEETS_CLI_CREDENTIALS_JSON" > "$HOME/.sheets-cli/credentials.json"
          fi
          if [ -n "$SHEETS_CLI_TOKEN_JSON" ]; then
            mkdir -p "$HOME/.sheets-cli"
            echo "$SHEETS_CLI_TOKEN_JSON" > "$HOME/.sheets-cli/token.json"
          fi
          bun test src/__tests__/integration
