name: Google APIs health

# Validates googleapis type coupling without live Google credentials.
# Dependabot opens PRs when newer googleapis is published; this catches drift on main.
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  googleapis-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Registry matches installed googleapis types
        run: bun test src/__tests__/api/googleapis-sync.test.ts
      - name: Report installed googleapis version
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').dependencies.googleapis)")
          echo "## googleapis" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned in package.json: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          LATEST=$(npm view googleapis version 2>/dev/null || echo "unknown")
          echo "Latest on npm registry: \`$LATEST\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$LATEST" != "unknown" ] && [ "${VERSION#\^}" != "$LATEST" ] && [ "${VERSION#~}" != "$LATEST" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> A newer \`googleapis\` is available. Dependabot should open an update PR, or bump manually and run \`bun scripts/generate-request-kinds.ts\`." >> "$GITHUB_STEP_SUMMARY"
          fi
